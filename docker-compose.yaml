services:
  english-flow:
    build:
      context: .
      dockerfile: Dockerfile
    image: english-flow:latest
    container_name: english-flow
    ports:
      - "8000:8000"
    environment:
      # Override from host .env if present; secrets come from backend/.env in the image
      EDGE_TTS_VOICE: ${EDGE_TTS_VOICE:-en-US-GuyNeural}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-mudar123}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod}
      DATA_DIR: /app/data
    env_file:
      - backend/.env
    volumes:
      - userdata:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  userdata:

