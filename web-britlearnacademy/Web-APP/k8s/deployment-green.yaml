apiVersion: apps/v1
kind: Deployment
metadata:
  name: britlearn-app-green
  namespace: britlearn-academy-app
  labels:
    app: britlearn-app
    slot: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: britlearn-app
      slot: green
  template:
    metadata:
      labels:
        app: britlearn-app
        slot: green
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: britlearn-app
          image: updateinformatica/britlearn-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: britlearn-app-config
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: britlearn-app-secrets
                  key: OPENROUTER_API_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: britlearn-app-data
        - name: tmp
          emptyDir: {}
