# fly.toml — English JATEL (container FastAPI + frontend estático)
# Deploy: fly launch (1ª vez) e fly deploy. Use `fly volumes create data --size 1`
# para criar o volume montado em /app/data (persistência free de 3 GB).
# A chave do LLM vai via secret, NÃO aqui: fly secrets set OPENROUTER_API_KEY=sk-or-...

app = "english-jatel"
primary_region = "gru"   # São Paulo (mais perto do BR)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATA_DIR = "/app/data"

[mounts]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Mantém a máquina sempre ligada (free tier cobre 1 VM shared 24/7).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.concurrency]]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
