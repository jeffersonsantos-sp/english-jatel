# Secret com dados sensíveis. TROQUE os valores antes de aplicar.
# Dica: gere SESSION_SECRET com `openssl rand -hex 32`.
apiVersion: v1
kind: Secret
metadata:
  name: english-jatel-secrets
  namespace: english-jatel
type: Opaque
stringData:
  ADMIN_PASS: "mudar123"            # troque por uma senha forte
  SESSION_SECRET: "change-me-in-prod"  # troque por um valor aleatorio e longo
  OPENROUTER_API_KEY: ""            # opcional: habilita correcao/conversa via LLM
