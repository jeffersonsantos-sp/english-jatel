apiVersion: apps/v1
kind: Deployment
metadata:
  name: english-jatel
  namespace: english-jatel
  labels:
    app: english-jatel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: english-jatel
  template:
    metadata:
      labels:
        app: english-jatel
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # uid do appuser na imagem
        fsGroup: 10001
      containers:
        - name: english-jatel
          # Para usar :latest, troque a tag e defina imagePullPolicy: Always.
          image: updateinformatica/english-jatel:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: english-jatel-config
          # ADMIN_PASS/SESSION_SECRET usam defaults do app; OPENROUTER_API_KEY
          # e demais secrets devem ser injetados em runtime (ex.: pipeline ou
          # `kubectl set env`). Veja observacao no service.yaml / cd.yaml.
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: english-jatel-data
        - name: tmp
          emptyDir: {}
