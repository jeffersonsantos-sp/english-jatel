apiVersion: apps/v1
kind: Deployment
metadata:
  name: english-jatel-green
  namespace: english-jatel
  labels:
    app: english-jatel
    slot: green
spec:
  # Em standby (0 replicas) para nao competir por escrita no volume
  # compartilhado (/app/data). Na promocao: edite a imagem para a nova tag,
  # escale para 1, aguarde o health e vire o Service para slot: green.
  replicas: 0
  selector:
    matchLabels:
      app: english-jatel
      slot: green
  template:
    metadata:
      labels:
        app: english-jatel
        slot: green
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # uid do appuser na imagem
        fsGroup: 10001
      containers:
        - name: english-jatel
          image: updateinformatica/english-jatel:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: english-jatel-config
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: english-jatel-secrets
                  key: OPENROUTER_API_KEY
          # Para criar o Secret (nao versionado):
          #   kubectl create secret generic english-jatel-secrets \
          #     --from-literal=OPENROUTER_API_KEY=sua_chave
          # Se o Secret nao existir, o pod nao sobe (protecao contra modo demo em prod).
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: english-jatel-data
        - name: tmp
          emptyDir: {}
