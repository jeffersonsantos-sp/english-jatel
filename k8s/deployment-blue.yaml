apiVersion: apps/v1
kind: Deployment
metadata:
  name: english-jatel-blue
  namespace: english-jatel
  labels:
    app: english-jatel
    slot: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: english-jatel
      slot: blue
  template:
    metadata:
      labels:
        app: english-jatel
        slot: blue
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001          # uid do appuser na imagem
        fsGroup: 10001
      containers:
        - name: english-jatel
          # Slot ATIVO (producao atual). Para promover, atualize a imagem do
          # slot green, escale-o para 1, aguarde o health e vire o Service
          # (slot: blue -> green). Veja docs/technical/deploy-kubernetes.md.
          image: updateinformatica/english-jatel:v1.8.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: english-jatel-config
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: english-jatel-secrets
                  key: OPENROUTER_API_KEY
          # ADMIN_PASS/SESSION_SECRET usam defaults do app; OPENROUTER_API_KEY
          # deve ser injetado em runtime (ex.: kubectl set env).
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: english-jatel-data
        - name: tmp
          emptyDir: {}
