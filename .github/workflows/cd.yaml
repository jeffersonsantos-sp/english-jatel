name: CD

# Dispara ao push de uma tag de versão (ex.: v1.0.0) — release versionado.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push image (Docker Hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Injeta a chave (GitHub Secret) em runtime — NÃO embute na imagem.
      - name: Smoke test (LLM key via secret, runtime only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:latest
        run: |
          docker pull "$IMAGE"
          docker run -d --name smoke -e OPENROUTER_API_KEY="$OPENROUTER_API_KEY" -p 8000:8000 "$IMAGE"
          for i in $(seq 1 20); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          echo "Health:"; curl -s http://localhost:8000/api/health; echo
          docker rm -f smoke

  deploy:
    name: Deploy to VPS (SSH)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:latest
            docker stop english-jatel || true
            docker rm english-jatel || true
            docker run -d --name english-jatel --restart unless-stopped \
              -p 8000:8000 \
              -e OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
              -e EDGE_TTS_VOICE=en-US-GuyNeural \
              ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:latest
