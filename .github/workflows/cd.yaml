name: CD

# Só roda depois que o workflow "CI" concluir com sucesso em main/master.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push image (Docker Hub)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Injeta a chave (GitHub Secret) em runtime — NÃO embute na imagem.
      - name: Smoke test (LLM key via secret, runtime only)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:latest
        run: |
          docker pull "$IMAGE"
          docker run -d --name smoke -e OPENROUTER_API_KEY="$OPENROUTER_API_KEY" -p 8000:8000 "$IMAGE"
          for i in $(seq 1 20); do curl -sf http://localhost:8000/api/health && break; sleep 2; done
          echo "Health:"; curl -s http://localhost:8000/api/health; echo
          docker rm -f smoke
