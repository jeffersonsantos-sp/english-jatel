name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend health check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install --no-cache-dir fastapi uvicorn python-multipart python-dotenv
      - name: Health check (FastAPI TestClient)
        run: python -c "from fastapi.testclient import TestClient; import main; c=TestClient(main.app); assert c.get('/api/health').status_code == 200; print(c.get('/api/health').json())"

  frontend-test:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: node --check frontend/app.js

  build-and-push:
    name: Build & push image (CD -> Docker Hub)
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/english-jatel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
