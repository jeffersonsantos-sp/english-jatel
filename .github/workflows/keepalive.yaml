name: Keepalive (Render free)

# Mantem o serviço Render free acordado: bate em /api/health a cada 10 min,
# antes do limite de 15 min de inatividade que faz o free tier "dormir".
on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping da URL do Render
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL nao definido (Settings > Secrets). Pulando."
            exit 0
          fi
          echo "Ping -> $RENDER_URL/api/health"
          curl -fsS --max-time 20 "$RENDER_URL/api/health" || echo "falhou (servico pode estar subindo)"
